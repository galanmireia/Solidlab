# Copia este archivo a config/config.yaml y ajústalo.
# Todos los porcentajes van en tanto por uno: 0.01 = 1 %.

exchange:
  id: binance          # cualquier exchange de ccxt: binance, bybit, kraken, bitget...
  testnet: true        # true = dinero ficticio del exchange. false = DINERO REAL.

market:
  symbol: BTC/USDT
  timeframe: 4h        # velas de 4 horas: menos ruido y menos comisiones que 5m/15m

strategy:
  name: ema_trend      # ema_trend | rsi_reversion
  params:
    fast: 20
    slow: 50
    trend: 200
    atr_period: 14
    atr_mult: 3.0

risk:
  risk_per_trade: 0.01       # se pierde como máximo un 1 % del capital si salta el stop
  max_position_pct: 0.5      # ninguna posición supera el 50 % del capital
  max_daily_loss_pct: 0.03   # -3 % en el día -> no abre más operaciones hasta mañana
  max_drawdown_pct: 0.15     # -15 % desde el máximo -> cierra todo y se detiene
  min_order_notional: 10     # USDT

costs:
  fee_rate: 0.001            # 0.1 % por operación
  slippage_bps: 5            # 0.05 % de deslizamiento simulado

backtest:
  initial_cash: 10000
  start: "2020-01-01"
  end: null                  # null = hasta hoy

paper:
  initial_cash: 10000
  poll_seconds: 30

live:
  enabled: false             # el modo real exige esto a true + TRADEBOT_LIVE_CONFIRM=YES
  poll_seconds: 30

log_level: INFO
