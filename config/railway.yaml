# Configuración para el servidor (Railway). Modo PAPER: dinero simulado.
name: Cripto
exchange:
  id: binance
  testnet: false   # solo se usan datos públicos de mercado; en paper no hay órdenes reales

market:
  # Monedas vigiladas (todas contra la misma moneda, USDT). Puedes añadir o quitar.
  symbols:
    - BTC/USDT
    - ETH/USDT
    - SOL/USDT
    - BNB/USDT
    - XRP/USDT
  timeframe: 4h

strategy:
  name: ema_trend

risk:
  risk_per_trade: 0.01
  max_position_pct: 0.3      # ninguna posición supera el 30 % del capital
  max_daily_loss_pct: 0.03
  max_drawdown_pct: 0.15
  min_order_notional: 10
  max_open_positions: 3      # como mucho 3 monedas compradas a la vez

costs:
  fee_rate: 0.001
  slippage_bps: 5

paper:
  initial_cash: 10000
  poll_seconds: 30

live:
  enabled: false

# /data es el volumen persistente: sobrevive a reinicios y nuevos despliegues.
data_dir: /data/data
state_dir: /data/state
journal_dir: /data/journal
log_dir: /data/logs
